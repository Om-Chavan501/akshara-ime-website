<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Support — AksharaIME</title>
<!-- Not a secret (the backend allowlist is what actually protects this), but there is no
     reason for it to appear in search results. -->
<meta name="robots" content="noindex, nofollow">
<style>
  :root {
    --ink: #1c1917; --paper: #fdfcfb; --muted: #6b6560; --accent: #ea7a2b;
    --accent-ink: #ffffff; --line: #e7e2dc; --card: #ffffff;
    --danger: #b23b3b; --danger-bg: #fbeaea; --ok: #2f7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f2efec; --paper: #17140f; --muted: #a39a90; --accent: #ea7a2b;
      --accent-ink: #17140f; --line: #332c22; --card: #201b14;
      --danger: #e08a8a; --danger-bg: #3a2323; --ok: #6fbf8e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink); line-height: 1.55;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  .wrap { max-width: 820px; margin: 0 auto; padding: 0 24px 64px; }
  header.top { display: flex; align-items: center; justify-content: space-between;
    padding: 24px 0; border-bottom: 1px solid var(--line); margin-bottom: 32px; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700;
    text-decoration: none; color: var(--ink); }
  .brand .mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent);
    color: var(--accent-ink); display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 0.95rem; }
  .who { color: var(--muted); font-size: 0.9rem; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  h2 { font-size: 1.1rem; margin: 32px 0 12px; }
  p.sub { color: var(--muted); margin: 0 0 24px; }

  label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 5px; }
  input[type=text], input[type=email] {
    width: 100%; padding: 11px 13px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 0.95rem; font-family: inherit;
  }
  .field { margin-bottom: 14px; }
  .btn { padding: 11px 22px; border-radius: 9px; font-weight: 600; font-size: 0.95rem;
    border: 1px solid transparent; cursor: pointer; font-family: inherit; }
  .btn.primary { background: var(--accent); color: var(--accent-ink); }
  .btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.link { background: none; border: none; color: var(--muted); text-decoration: underline;
    padding: 0; font-size: 0.85rem; }

  .card { background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    padding: 20px; margin-bottom: 16px; }
  .row { display: flex; justify-content: space-between; gap: 14px; padding: 7px 0;
    border-bottom: 1px solid var(--line); font-size: 0.9rem; }
  .row:last-child { border-bottom: none; }
  .row .k { color: var(--muted); }
  .row .v { font-weight: 600; text-align: right; word-break: break-all; }
  .pill { display: inline-block; font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; background: var(--line); }
  .pill.ok { background: var(--accent); color: var(--accent-ink); }

  .msg { padding: 13px 15px; border-radius: 9px; margin: 14px 0; font-size: 0.9rem; }
  .msg.err { background: var(--danger-bg); color: var(--danger); }
  .msg.ok { background: #e8f3ec; color: var(--ok); }
  @media (prefers-color-scheme: dark) { .msg.ok { background: #1d2f24; } }
  .msg .detail { display: block; margin-top: 6px; opacity: 0.85; font-size: 0.85rem; }

  .danger-zone { border-color: var(--danger); }
  .danger-zone h3 { margin: 0 0 4px; font-size: 1rem; color: var(--danger); }
  .danger-zone p { margin: 0 0 16px; font-size: 0.88rem; color: var(--muted); }
  .hidden { display: none; }
  .muted-note { color: var(--muted); font-size: 0.85rem; }
  code { background: var(--paper); border: 1px solid var(--line); border-radius: 5px;
    padding: 1px 5px; font-size: 0.85em; }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <a class="brand" href="index.html"><span class="mark">अ</span> AksharaIME Support</a>
    <span class="who">
      <span id="who-email"></span>
      <button id="sign-out" class="btn link hidden">Sign out</button>
    </span>
  </header>

  <!-- ================= Sign in ================= -->
  <section id="signin-section">
    <h1>Support sign-in</h1>
    <p class="sub">Access is restricted to the administrator account.</p>

    <div id="step-email">
      <div class="field">
        <label for="email">Email address</label>
        <input type="email" id="email" autocomplete="email" placeholder="you@example.com">
      </div>
      <button class="btn primary" id="send-code">Send code</button>
    </div>

    <div id="step-code" class="hidden">
      <div class="field">
        <label for="code">6-digit code sent to <span id="code-dest"></span></label>
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456">
      </div>
      <button class="btn primary" id="verify-code">Verify</button>
      <button class="btn link" id="back-to-email" style="margin-left:12px;">Use a different email</button>
    </div>

    <div id="signin-msg"></div>
  </section>

  <!-- ================= Console ================= -->
  <section id="console-section" class="hidden">
    <h1>Customer lookup</h1>
    <p class="sub">Find a customer by the email they signed in with, or by a Paddle order id.</p>

    <div class="field">
      <label for="q-email">Email</label>
      <input type="email" id="q-email" placeholder="customer@example.com">
    </div>
    <div class="field">
      <label for="q-txn">…or Paddle transaction id</label>
      <input type="text" id="q-txn" placeholder="txn_01…">
    </div>
    <button class="btn primary" id="do-lookup">Look up</button>

    <div id="lookup-msg"></div>
    <div id="results" class="hidden"></div>
  </section>

</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

const SUPABASE_URL = "https://vsckavugkyeoanbygpqt.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzY2thdnVna3llb2FuYnlncHF0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjI2MDgsImV4cCI6MjEwMDUzODYwOH0.KY0LBXyfwfR-averiCtMGsOXXfWCA3UFSm4kaOu82r8";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = (id) => document.getElementById(id);
const show = (id) => $(id).classList.remove("hidden");
const hide = (id) => $(id).classList.add("hidden");

function message(containerId, kind, text, detail) {
  $(containerId).innerHTML =
    `<div class="msg ${kind}">${escapeHtml(text)}` +
    (detail ? `<span class="detail">${escapeHtml(detail)}</span>` : "") + `</div>`;
}
function clearMessage(containerId) { $(containerId).innerHTML = ""; }

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
  ));
}

function formatDate(value) {
  if (!value) return "—";
  return new Date(value).toLocaleString();
}

// ---------------------------------------------------------------- auth

async function refreshSession() {
  const { data: { session } } = await supabase.auth.getSession();
  if (session) {
    $("who-email").textContent = session.user.email;
    show("sign-out");
    hide("signin-section");
    show("console-section");
  } else {
    $("who-email").textContent = "";
    hide("sign-out");
    show("signin-section");
    hide("console-section");
  }
}

$("send-code").addEventListener("click", async () => {
  const email = $("email").value.trim();
  if (!email) return message("signin-msg", "err", "Enter an email address.");
  $("send-code").disabled = true;
  clearMessage("signin-msg");
  // shouldCreateUser:false -- this is a sign-in for an existing admin, not a signup path.
  const { error } = await supabase.auth.signInWithOtp({
    email, options: { shouldCreateUser: false },
  });
  $("send-code").disabled = false;
  if (error) return message("signin-msg", "err", error.message);
  $("code-dest").textContent = email;
  hide("step-email");
  show("step-code");
});

$("back-to-email").addEventListener("click", () => {
  clearMessage("signin-msg");
  $("code").value = "";
  hide("step-code");
  show("step-email");
});

$("verify-code").addEventListener("click", async () => {
  const email = $("email").value.trim();
  const token = $("code").value.trim();
  if (!token) return message("signin-msg", "err", "Enter the code from your email.");
  $("verify-code").disabled = true;
  const { error } = await supabase.auth.verifyOtp({ email, token, type: "email" });
  $("verify-code").disabled = false;
  if (error) return message("signin-msg", "err", error.message);
  clearMessage("signin-msg");
  await refreshSession();
});

$("sign-out").addEventListener("click", async () => {
  await supabase.auth.signOut();
  $("results").innerHTML = "";
  hide("results");
  clearMessage("lookup-msg");
  hide("step-code");
  show("step-email");
  await refreshSession();
});

// ---------------------------------------------------------------- admin API

async function callAdmin(payload) {
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) throw new Error("Your session expired — sign in again.");
  const response = await fetch(`${SUPABASE_URL}/functions/v1/admin`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_ANON_KEY,
      Authorization: `Bearer ${session.access_token}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify(payload),
  });
  const body = await response.json().catch(() => ({}));
  return { ok: response.ok, status: response.status, body };
}

// ---------------------------------------------------------------- lookup

let lastLookup = null;

$("do-lookup").addEventListener("click", doLookup);

async function doLookup() {
  const email = $("q-email").value.trim();
  const transactionId = $("q-txn").value.trim();
  if (!email && !transactionId) {
    return message("lookup-msg", "err", "Enter an email or a transaction id.");
  }
  clearMessage("lookup-msg");
  hide("results");
  $("do-lookup").disabled = true;

  try {
    const { ok, status, body } = await callAdmin({
      action: "lookup",
      ...(email ? { email } : {}),
      ...(transactionId ? { transaction_id: transactionId } : {}),
    });

    if (status === 404 && body.error === "not found") {
      return message("lookup-msg", "err",
        "This account isn't authorised for support access.");
    }
    if (!ok) return message("lookup-msg", "err", body.error || "Lookup failed.", body.detail);
    if (!body.found) return message("lookup-msg", "err", body.reason || "No customer found.");

    lastLookup = body;
    renderResults(body);
  } catch (err) {
    message("lookup-msg", "err", err.message);
  } finally {
    $("do-lookup").disabled = false;
  }
}

function renderResults(data) {
  const licenses = data.licenses ?? [];
  const devices = data.devices ?? [];
  const orders = data.orders ?? [];

  let html = `<h2>Customer</h2><div class="card">
    <div class="row"><span class="k">Email</span><span class="v">${escapeHtml(data.email)}</span></div>
    <div class="row"><span class="k">User id</span><span class="v">${escapeHtml(data.user_id)}</span></div>
  </div>`;

  html += `<h2>Licenses</h2>`;
  if (licenses.length === 0) {
    html += `<div class="card"><p class="muted-note">No licenses on this account.</p></div>`;
  }
  for (const license of licenses) {
    const licenseDevices = devices.filter((d) => d.license_id === license.id);
    // A device occupies a slot while its lease is unexpired, regardless of the
    // deactivated flag -- mirroring how activate_device() actually counts.
    const now = Date.now();
    const held = licenseDevices.filter(
      (d) => d.lease_expires_at && new Date(d.lease_expires_at).getTime() > now
    ).length;

    html += `<div class="card">
      <div class="row"><span class="k">License</span><span class="v">${escapeHtml(license.id)}</span></div>
      <div class="row"><span class="k">Type</span><span class="v">
        <span class="pill ${license.status === "active" ? "ok" : ""}">${escapeHtml(license.kind)} · ${escapeHtml(license.status)}</span>
      </span></div>
      <div class="row"><span class="k">Devices</span><span class="v">${held} of ${license.max_devices} slots held</span></div>
      <div class="row"><span class="k">Created</span><span class="v">${formatDate(license.created_at)}</span></div>
    </div>`;

    if (licenseDevices.length) {
      html += `<div class="card">`;
      for (const device of licenseDevices) {
        const leaseActive = device.lease_expires_at && new Date(device.lease_expires_at).getTime() > now;
        const state = device.deactivated_at
          ? (leaseActive ? "deactivated (slot still held until lease expires)" : "deactivated")
          : (leaseActive ? "active" : "lease expired");
        html += `<div class="row">
          <span class="k">${escapeHtml(device.name || "Unnamed Mac")}</span>
          <span class="v">${escapeHtml(state)}<br>
            <span class="muted-note">lease until ${formatDate(device.lease_expires_at)}</span>
          </span></div>`;
      }
      html += `</div>`;
    }

    html += `<div class="card danger-zone">
      <h3>Move this license to a different email</h3>
      <p>For when a buyer mistyped their address at checkout. Only works if that account
         has never been signed in to, and the destination has no account yet.</p>
      <div class="field">
        <label for="to-${license.id}">Correct email address</label>
        <input type="email" id="to-${license.id}" placeholder="correct@example.com">
      </div>
      <div class="field">
        <label for="reason-${license.id}">Reason (recorded in the audit log)</label>
        <input type="text" id="reason-${license.id}" placeholder="buyer mistyped gmail as gmial at checkout">
      </div>
      <button class="btn danger" data-transfer="${license.id}">Move license</button>
    </div>`;
  }

  html += `<h2>Orders</h2>`;
  if (orders.length === 0) {
    html += `<div class="card"><p class="muted-note">No orders recorded.</p></div>`;
  } else {
    html += `<div class="card">`;
    for (const order of orders) {
      const amount = order.amount ? `${order.currency} ${(Number(order.amount) / 100).toFixed(2)}` : "—";
      html += `<div class="row">
        <span class="k">${formatDate(order.created_at)}<br>
          <span class="muted-note">${escapeHtml(order.paddle_transaction_id || "")}</span></span>
        <span class="v">${escapeHtml(amount)}<br>
          <span class="muted-note">${order.max_devices} device(s)</span></span>
      </div>`;
    }
    html += `</div>`;
  }

  $("results").innerHTML = html;
  show("results");

  for (const button of document.querySelectorAll("[data-transfer]")) {
    button.addEventListener("click", () => transferLicense(button.dataset.transfer));
  }
}

async function transferLicense(licenseId) {
  const toEmail = $(`to-${licenseId}`).value.trim();
  const reason = $(`reason-${licenseId}`).value.trim();
  if (!toEmail) return message("lookup-msg", "err", "Enter the corrected email address.");

  const from = lastLookup?.email ?? "this account";
  if (!confirm(
    `Move this license from ${from} to ${toEmail}?\n\n` +
    `This changes which account can activate it. The change is recorded in the audit log.`
  )) return;

  clearMessage("lookup-msg");
  const { ok, body } = await callAdmin({
    action: "transfer_license",
    license_id: licenseId,
    to_email: toEmail,
    ...(reason ? { reason } : {}),
  });

  if (!ok) return message("lookup-msg", "err", body.error || "Transfer failed.", body.detail);

  message("lookup-msg", "ok",
    `License moved from ${body.from_email} to ${body.to_email}.` +
    (body.audit_recorded ? "" : " (Warning: the audit record failed to write.)"));

  // Re-query under the new address so the view reflects reality rather than stale state.
  $("q-email").value = body.to_email;
  $("q-txn").value = "";
  await doLookup();
}

refreshSession();
</script>
</body>
</html>
