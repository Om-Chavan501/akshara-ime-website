name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Both of these are correctness gates, not style lints -- each exists because the class
      # of bug it catches is invisible to review and produces no error at build or runtime.
      #
      # A misspelt CSS custom property makes the browser drop the whole declaration, so the
      # layout is quietly wrong on one property and nothing complains. `--space-5` (no such
      # step) shipped to both the homepage and the support console this way.
      - run: npm run verify:tokens
      # The example checker hits the real deployed transliterate function: every hardcoded
      # example word on the site is verified against the production engine before the build
      # can ship. This is what would have caught `aamhii` and `maraaThii` automatically
      # instead of by review.
      - run: npm run verify:examples
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
